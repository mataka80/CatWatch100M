name: Build CatWatch 100M APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Download Official TFLite Cat Detection Model (EfficientDet-Lite0)
        run: |
          mkdir -p app/src/main/assets
          if [ ! -f app/src/main/assets/model.tflite ]; then
            curl -L "https://storage.googleapis.com/download.tensorflow.org/models/tflite/task_library/object_detection/android/lite-model_efficientdet_lite0_detection_metadata_1.tflite" -o app/src/main/assets/model.tflite
          fi
          ls -lh app/src/main/assets/model.tflite

      - name: 4. Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 5. Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 6. Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CatWatch100M-Install-APK
          path: app/build/outputs/apk/debug/app-debug.apk
